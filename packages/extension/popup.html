<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Habemus Papam</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        color: #241f1b;
        background: #f8f4ec;
      }

      body {
        box-sizing: border-box;
        margin: 0;
        padding: 20px;
        width: 340px;
      }

      .eyebrow {
        margin: 0 0 4px;
        color: #8b1e2d;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: Georgia, serif;
        font-size: 28px;
        line-height: 1.1;
      }

      .birth-name {
        margin: 5px 0 0;
        color: #625a52;
      }

      .celebration {
        margin: 16px 0 0;
        border-radius: 8px;
        padding: 10px 12px;
        background: #fff0c2;
        font-weight: 650;
      }

      .facts {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin: 18px 0;
      }

      .facts div {
        border: 1px solid #ddd3c4;
        border-radius: 8px;
        padding: 10px;
        background: #fffdf9;
      }

      dt {
        color: #70675e;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      dd {
        margin: 4px 0 0;
        font-weight: 650;
      }

      h2 {
        margin: 0 0 8px;
        font-size: 13px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .history {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .history li {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        border-top: 1px solid #ddd3c4;
        padding: 8px 0;
      }

      .history small {
        flex: none;
        color: #70675e;
      }
    </style>
  </head>
  <body>
    <main id="output" aria-live="polite">Loading…</main>
    <script src="popup.js"></script>
  </body>
</html>
