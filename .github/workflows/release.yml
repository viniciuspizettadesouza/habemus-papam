name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      package: ${{ steps.status.outputs.package }}
      should-publish: ${{ steps.status.outputs.should-publish }}
      version: ${{ steps.status.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release candidate
        run: |
          pnpm lint
          pnpm format:check
          pnpm docs:api
          pnpm test
          pnpm test:coverage
          pnpm test:package
          pnpm build:extension

      - name: Create or update release pull request
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          commit: "chore: prepare release"
          title: "chore: prepare release"
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check publication status
        id: status
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: node scripts/release-status.mjs

  publish:
    name: Publish npm package
    needs: prepare
    if: needs.prepare.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11

      - name: Publish to npm with provenance
        run: node scripts/publish-release.mjs

  finalize:
    name: Finalize GitHub release
    needs:
      - prepare
      - publish
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped') &&
      needs.prepare.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create Git tag when missing
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${RELEASE_VERSION}" >/dev/null; then
            echo "Tag v${RELEASE_VERSION} already exists."
          else
            git tag "v${RELEASE_VERSION}"
            git push origin "v${RELEASE_VERSION}"
          fi

      - name: Create GitHub release when missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if gh release view "v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "GitHub release v${RELEASE_VERSION} already exists."
          else
            gh release create "v${RELEASE_VERSION}" --verify-tag --generate-notes --title "v${RELEASE_VERSION}"
          fi
